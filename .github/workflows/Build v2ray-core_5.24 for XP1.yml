name: Build v2ray-core_5.24 for XP1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-xp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout go-backports (XP Go 1.21)
        uses: actions/checkout@v4
        with:
          repository: BieHDC/go-backports
          ref: release-branch.go1.21-nt51
          path: go-backports

      - name: Setup bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache-dependency-path: v2ray-core_5.24.0/go.sum

      - name: Build XP-compatible Go toolchain
        working-directory: go-backports/src
        run: |
          export CGO_ENABLED=0
          ./make.bash

      - name: Add XP Go to PATH
        run: |
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> $GITHUB_PATH
          go version

      - name: Verify source
        run: |
          ls -la
          test -f v2ray-core_5.24.0/go.mod || { echo "缺少 go.mod"; exit 1; }
          head -5 v2ray-core_5.24.0/go.mod

      - name: Download modules
        working-directory: v2ray-core_5.24.0
        run: go mod download

      - name: Build for Windows XP (386)
        working-directory: v2ray-core_5.24.0
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: 386
        run: go build -o v2ray.exe -trimpath -ldflags "-s -w -buildid=" ./main

      - name: Prepare output
        run: |
          mkdir -p dist
          cp v2ray-core_5.24.0/v2ray.exe dist/
          ls -lh dist/
          cd dist
          zip -r ../v2ray-5.24-windows-xp-386.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-5.24-windows-xp-386
          path: dist/
          retention-days: 30

      - name: Create Release (when tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: v2ray-5.24-windows-xp-386.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

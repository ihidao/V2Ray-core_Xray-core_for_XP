
name: Build Clash.Meta for Windows XP

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Clash.Meta branch, tag or commit'
        required: true
        default: 'Meta'
        type: string

  push:
    tags:
      - 'clash-meta-v*'

# ==========================================================
# 全局变量
# ==========================================================
env:
  CLASH_META_REPO: 'c0001/Clash.Meta'
  CLASH_META_REF: 'Meta'

  GO_VERSION: '1.21.13'

  GO_BACKPORTS_REPO: 'BieHDC/go-backports'
  GO_BACKPORTS_REF: 'release-branch.go1.21-nt51'

permissions:
  contents: write

jobs:
  build-xp:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # 1. Checkout 主仓库
      # ----------------------------------------------------
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # 2. 确定 Clash.Meta 源码版本
      # ----------------------------------------------------
      - name: Determine source ref
        id: version
        shell: bash
        env:
          INPUT_REF: ${{ inputs.source_ref }}
        run: |
          REF="${INPUT_REF:-$CLASH_META_REF}"

          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          echo "Clash.Meta source ref: $REF"

      # ----------------------------------------------------
      # 3. Checkout 旧版 Clash.Meta
      # ----------------------------------------------------
      - name: Checkout Clash.Meta source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLASH_META_REPO }}
          ref: ${{ steps.version.outputs.ref }}
          path: clash-meta-src
          fetch-depth: 0

      # ----------------------------------------------------
      # 4. 获取源码版本信息
      # ----------------------------------------------------
      - name: Get source version
        id: buildver
        working-directory: clash-meta-src
        shell: bash
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Clash.Meta version: $VERSION"
          echo "Commit:"
          git log -1 --oneline

      # ----------------------------------------------------
      # 5. Checkout XP Go 源码
      # ----------------------------------------------------
      - name: Checkout go-backports
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GO_BACKPORTS_REPO }}
          ref: ${{ env.GO_BACKPORTS_REF }}
          path: go-backports

      # ----------------------------------------------------
      # 6. 安装 Bootstrap Go
      # ----------------------------------------------------
      - name: Setup bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # ----------------------------------------------------
      # 7. 编译 XP 兼容 Go 工具链
      # ----------------------------------------------------
      - name: Build XP-compatible Go toolchain
        working-directory: go-backports/src
        shell: bash
        run: |
          export CGO_ENABLED=0
          ./make.bash

      # ----------------------------------------------------
      # 8. 切换到 XP Go
      # ----------------------------------------------------
      - name: Add XP Go to PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"

          export PATH="$GITHUB_WORKSPACE/go-backports/bin:$PATH"

          go version
          go env GOROOT GOOS GOARCH

      # ----------------------------------------------------
      # 9. 检查 Clash.Meta 源码
      # ----------------------------------------------------
      - name: Check Clash.Meta source
        working-directory: clash-meta-src
        shell: bash
        run: |
          echo "Checking Clash.Meta source..."

          if [ ! -f go.mod ]; then
            echo "错误：找不到 go.mod"
            exit 1
          fi

          if [ ! -f main.go ]; then
            echo "错误：找不到 main.go"
            exit 1
          fi

          echo "Go module:"
          head -n 5 go.mod

          echo "Source files:"
          ls -la

          if grep -q '^module github.com/metacubex/mihomo' go.mod; then
            echo "错误：当前源码实际上是 Mihomo，不是旧版 Clash.Meta"
            exit 1
          fi

      # ----------------------------------------------------
      # 10. 下载 Go 模块
      # ----------------------------------------------------
      - name: Download modules
        working-directory: clash-meta-src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          go mod download

      # ----------------------------------------------------
      # 11. 编译 Windows XP 32 位
      # ----------------------------------------------------
      - name: Build Clash.Meta for Windows XP (386)
        working-directory: clash-meta-src
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: 386
          GOTOOLCHAIN: local
        shell: bash
        run: |
          echo "Building Clash.Meta for Windows XP..."

          go build \
            -o clash-meta.exe \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            .

          echo "Build completed."

          file clash-meta.exe
          ls -lh clash-meta.exe

      # ----------------------------------------------------
      # 12. 检查编译结果
      # ----------------------------------------------------
      - name: Check executable
        working-directory: clash-meta-src
        shell: bash
        run: |
          if [ ! -s clash-meta.exe ]; then
            echo "错误：clash-meta.exe 不存在或为空"
            exit 1
          fi

          file clash-meta.exe

      # ----------------------------------------------------
      # 13. 整理输出
      # ----------------------------------------------------
      - name: Prepare output
        env:
          VERSION: ${{ steps.buildver.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist

          cp clash-meta-src/clash-meta.exe dist/

          cp clash-meta-src/LICENSE dist/ 2>/dev/null || true

          cat > dist/README.txt << EOF
          Clash.Meta Windows XP 32-bit

          Version: $VERSION
          OS: Windows XP
          Architecture: x86 (386)

          Bootstrap Go: $GO_VERSION
          XP Go: go-backports
          CGO: Disabled

          This is an experimental XP-compatible build.
          Please test on Windows XP SP3.
          EOF

          cd dist

          zip -r "../clash-meta-${VERSION}-windows-xp-386.zip" .

      # ----------------------------------------------------
      # 14. 上传 Artifact
      # ----------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-meta-${{ steps.buildver.outputs.version }}-windows-xp-386
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------
      # 15. 创建 Release
      # ----------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/clash-meta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: clash-meta-${{ steps.buildver.outputs.version }}-windows-xp-386.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

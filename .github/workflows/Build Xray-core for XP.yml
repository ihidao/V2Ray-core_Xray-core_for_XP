name: Build Xray-core for XP

run-name: Xray_${{ inputs.xray_ref }}_XP

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: "Xray-core version(e.g. v1.8.7)"
        required: true
        default: "v1.8.7"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Xray ${{ inputs.xray_ref }} XP x86
    runs-on: ubuntu-latest

    env:
      XRAY_REPO: XTLS/Xray-core
      GO_BACKPORTS_REPO: BieHDC/go-backports
      GO_BACKPORTS_REF: release-branch.go1.21-nt51
      BOOTSTRAP_GO_VERSION: "1.21.13"

      GOOS: windows
      GOARCH: "386"
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local

    steps:
      # ==========================================
      # 1. 获取 Xray 源码
      # ==========================================
      - name: Checkout Xray
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_ref }}
          path: xray-src
          fetch-depth: 0

      # ==========================================
      # 2. 安装 Bootstrap Go
      # ==========================================
      - name: Setup Bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.BOOTSTRAP_GO_VERSION }}
          check-latest: false

      # ==========================================
      # 3. 获取 Go XP backports
      # ==========================================
      - name: Checkout Go Backports
        uses: actions/checkout@v4
        with:
          repository: BieHDC/go-backports
          ref: release-branch.go1.21-nt51
          path: go-backports
          fetch-depth: 1

      # ==========================================
      # 4. 编译 XP 专用 Go 工具链
      # ==========================================
      - name: Build Go Backports
        shell: bash
        run: |
          set -eux

          BOOTSTRAP_GOROOT="$(go env GOROOT)"

          cd go-backports/src

          GOROOT_BOOTSTRAP="$BOOTSTRAP_GOROOT" ./make.bash

          cd "$GITHUB_WORKSPACE"

          echo "GOROOT=$GITHUB_WORKSPACE/go-backports" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 5. 检查 Go 工具链
      # ==========================================
      - name: Check Go Toolchain
        shell: bash
        run: |
          set -eux

          go version
          go env GOROOT
          go env GOOS
          go env GOARCH

      # ==========================================
      # 6. 下载 Xray 依赖
      # ==========================================
      - name: Download Dependencies
        shell: bash
        run: |
          set -eux

          cd xray-src

          go mod download

          go list -m golang.zx2c4.com/wireguard

            # ==========================================
      # 7. 禁用 WireGuard Windows IPC
      # ==========================================
      - name: Disable WireGuard Windows IPC
        shell: bash
        run: |
          set -eux

          cd xray-src

          # 获取 WireGuard 模块目录
          WG_DIR="$(go list -m -f '{{.Dir}}' golang.zx2c4.com/wireguard)"

          # 复制到可写目录
          PATCH_DIR="$GITHUB_WORKSPACE/wireguard-xp"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          cp -a "$WG_DIR/." "$PATCH_DIR/"

          chmod -R u+w "$PATCH_DIR"

          FILE="$PATCH_DIR/ipc/uapi_windows.go"

          echo "Patching: $FILE"

          # 修改 WireGuard Windows IPC
          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          pattern = (
              r'func init\(\)\s*\{\s*'
              r'var err error\s*'
              r'UAPISecurityDescriptor,\s*err\s*=\s*'
              r'windows\.SecurityDescriptorFromString\([^\n]*\)\s*'
              r'if err != nil\s*\{\s*'
              r'panic\(err\)\s*'
              r'\}\s*'
              r'\}'
          )

          replacement = '''func init() {
              // Disabled for Windows XP.
              UAPISecurityDescriptor = nil
          }'''

          src, count = re.subn(pattern, replacement, src, count=1)

          if count != 1:
              print("ERROR: Original init() not found")
              sys.exit(1)

          signature = 'func UAPIListen(name string) (net.Listener, error) {'

          if signature not in src:
              print("ERROR: UAPIListen() not found")
              sys.exit(1)

          if '"errors"' not in src:
              src = src.replace(
                  'import (',
                  'import (\n\t"errors"',
                  1
              )

          src = src.replace(
              signature,
              signature + '''
              return nil, errors.New("WireGuard UAPI disabled on Windows XP")
          ''',
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)

          print("WireGuard IPC patched successfully.")
          PY

          gofmt -w "$FILE"

          # 使用本地修改后的 WireGuard 模块
          go mod edit -replace="golang.zx2c4.com/wireguard=$PATCH_DIR"

          echo "===== Verify patch ====="
          grep -n -A 5 'func init()' "$FILE"
          grep -n -A 5 'func UAPIListen' "$FILE"

          echo "===== Verify replace ====="
          go list -m golang.zx2c4.com/wireguard

      # ==========================================
      # 8. 编译 Windows XP 32 位 Xray
      # ==========================================
      - name: Build Xray Windows XP x86
        shell: bash
        run: |
          set -eux

          cd xray-src

          mkdir -p ../dist

          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o ../dist/xray.exe \
            -v ./main

      # ==========================================
      # 9. 检查编译结果
      # ==========================================
      - name: Verify Build
        shell: bash
        run: |
          set -eux

          ls -lh dist/xray.exe

          file dist/xray.exe

          echo "Build completed."

      # ==========================================
      # 10. 上传编译文件
      # ==========================================
      - name: Upload Xray XP
        uses: actions/upload-artifact@v4
        with:
          name: Xray-${{ inputs.xray_ref }}-Windows-XP-x86
          path: dist/xray.exe
          if-no-files-found: error
          retention-days: 30

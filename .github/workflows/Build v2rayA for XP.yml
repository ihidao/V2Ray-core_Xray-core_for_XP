
name: Build v2rayA for XP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v2raya-xp.yml"

permissions:
  contents: read

env:
  V2RAYA_TAG: v2.2.7.5
  GO_BRANCH: release-branch.go1.21-nt51
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: Build Windows XP x86
    runs-on: ubuntu-22.04

    steps:
      # 1. 安装 Bootstrap Go
      - name: Install bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"
          cache: false

      # 2. 下载 XP 兼容 Go 源码
      - name: Checkout Go XP source
        shell: bash
        run: |
          set -eux

          git clone --depth 1 \
            --branch "${GO_BRANCH}" \
            https://github.com/BieHDC/go-backports.git \
            go-backports

      # 3. 编译 Go XP 工具链
      - name: Build Go XP cross compiler
        shell: bash
        run: |
          set -eux

          cd go-backports/src

          export GOROOT_BOOTSTRAP="$(go env GOROOT)"

          unset GOOS
          unset GOARCH
          unset CGO_ENABLED

          ./make.bash

          cd ../..

          echo "GOROOT=$GITHUB_WORKSPACE/go-backports" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"

      # 4. 检查 Go 工具链
      - name: Verify XP Go toolchain
        shell: bash
        run: |
          set -eux

          go version
          go env GOROOT
          go env GOHOSTOS GOHOSTARCH

      # 5. 下载 v2rayA 源码
      - name: Checkout v2rayA
        shell: bash
        run: |
          set -eux

          git clone --depth 1 \
            --branch "${V2RAYA_TAG}" \
            https://github.com/v2rayA/v2rayA.git \
            v2rayA

      # 6. 下载 Web 前端
      - name: Download and prepare Web frontend
        shell: bash
        run: |
          set -eux

          cd v2rayA

          curl -fL \
            https://github.com/v2rayA/v2rayA/releases/download/v2.2.7.5/web.tar.gz \
            -o web.tar.gz

          echo "89bff9248a9cba8b7bda6e1202ac565dbca377319423868835235deddbfb182a  web.tar.gz" \
            | sha256sum -c -

          mkdir -p service/server/router/web

          tar -xzf web.tar.gz \
            -C service/server/router/web \
            --strip-components=1

          test -n "$(find service/server/router/web -type f -print -quit)"

          echo "Web frontend prepared successfully"

      # 7. 下载真正的 xdg v0.3.4 源码
      - name: Checkout XP compatible xdg
        shell: bash
        run: |
          set -eux

          git clone --depth 1 \
            --branch v0.3.4 \
            https://github.com/adrg/xdg.git \
            xdg-compat

          echo "===== xdg source version ====="
          git -C xdg-compat describe --tags --exact-match

          echo "===== Check old source ====="

          # v0.3.4 不应包含新版 KnownFolderPath 调用
          if grep -R -n "KnownFolderPath" xdg-compat \
            --include="*.go"; then
            echo "ERROR: incompatible KnownFolderPath found"
            exit 1
          fi

          test -f xdg-compat/go.mod

      # 8. 强制使用本地 xdg v0.3.4
      - name: Fix XP dependencies
        working-directory: v2rayA/service
        shell: bash
        run: |
          set -eux

          echo "===== Original xdg dependency ====="
          grep -n "adrg/xdg" go.mod || true

          # 删除之前可能存在的替换规则
          go mod edit \
            -dropreplace=github.com/adrg/xdg

          # 使用本地源码替换，不再依赖远程版本选择
          go mod edit \
            -replace=github.com/adrg/xdg=$GITHUB_WORKSPACE/xdg-compat

          echo "===== Current replacement ====="
          grep -n "adrg/xdg" go.mod

          # 更新依赖及校验文件
          go mod tidy

          go mod download
          go mod verify

          # 检查实际生效的本地目录
          XDG_DIR="$(go list -m -f '{{.Replace.Dir}}' github.com/adrg/xdg)"

          echo "Actual xdg directory: $XDG_DIR"

          if [ "$XDG_DIR" != "$GITHUB_WORKSPACE/xdg-compat" ]; then
            echo "ERROR: local xdg replacement did not take effect"
            exit 1
          fi

          # 检查 xdg 包实际编译目录
          PACKAGE_DIR="$(go list -f '{{.Dir}}' github.com/adrg/xdg)"

          echo "Actual package directory: $PACKAGE_DIR"

          if [ "$PACKAGE_DIR" != "$GITHUB_WORKSPACE/xdg-compat" ]; then
            echo "ERROR: unexpected xdg package directory"
            exit 1
          fi

          echo "XP xdg replacement verified successfully"

      # 9. 编译 Windows XP 32 位程序
      - name: Build v2rayA
        working-directory: v2rayA/service
        shell: bash
        run: |
          set -eux

          rm -rf ../dist
          mkdir -p ../dist

          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=0

          echo "===== Build environment ====="
          go version
          go env GOOS GOARCH CGO_ENABLED GOROOT

          go build \
            -mod=readonly \
            -trimpath \
            -tags "netgo osusergo" \
            -ldflags "-s -w" \
            -o ../dist/v2raya.exe \
            .

          test -s ../dist/v2raya.exe

          echo "Build completed"

      # 10. 检查 EXE 内嵌依赖信息
      - name: Verify executable dependencies
        shell: bash
        run: |
          set -eux

          EXE="v2rayA/dist/v2raya.exe"

          test -s "$EXE"

          echo "===== EXE file information ====="
          file "$EXE"
          ls -lh "$EXE"
          sha256sum "$EXE"

          echo "===== Go build information ====="

          go version -m "$EXE" | tee /tmp/v2raya-build-info.txt

          echo "===== Verify local xdg replacement in EXE ====="

          if ! grep -F "$GITHUB_WORKSPACE/xdg-compat" \
            /tmp/v2raya-build-info.txt; then
            echo "ERROR: EXE does not contain the expected local xdg replacement"
            exit 1
          fi

          echo "EXE dependency verification passed"

      # 11. 生成 README
      - name: Prepare README
        shell: bash
        run: |
          set -eux

          cat > v2rayA/dist/README.txt <<'EOF'
          v2rayA Windows XP x86 build

          Version: v2.2.7.5
          Architecture: Windows 32-bit x86
          Go: BieHDC/go-backports Go 1.21 NT5.1
          CGO: disabled

          The V2Ray core is not included.
          You must provide a compatible external v2ray.exe.

          Web interface:
          http://127.0.0.1:2017

          This is an experimental Windows XP compatibility build.
          EOF

      # 12. 检查并准备上传文件
      - name: Prepare release files
        shell: bash
        run: |
          set -eux

          rm -rf release
          mkdir -p release

          cp v2rayA/dist/v2raya.exe release/
          cp v2rayA/dist/README.txt release/

          echo "===== Release directory ====="
          ls -lah release/

          test -s release/v2raya.exe
          test -s release/README.txt

          echo "===== File sizes ====="
          wc -c release/v2raya.exe release/README.txt

          echo "===== SHA256 ====="
          sha256sum release/*

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 2

      # 13. 上传 Artifact
      - name: Upload XP build
        uses: actions/upload-artifact@v4
        with:
          name: v2raya-xp-x86
          path: release/
          if-no-files-found: error
          compression-level: 6
          overwrite: true
          retention-days: 7

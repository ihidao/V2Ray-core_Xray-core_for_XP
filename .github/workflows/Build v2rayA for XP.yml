
name: Build v2rayA for XP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v2raya-xp.yml"

permissions:
  contents: read

env:
  V2RAYA_TAG: v2.2.7.5
  GO_BRANCH: release-branch.go1.21-nt51
  GOOS: windows
  GOARCH: "386"
  CGO_ENABLED: "0"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: Build Windows XP x86
    runs-on: ubuntu-22.04

    steps:
      - name: Install bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"
          cache: false

      - name: Checkout Go XP source
        run: |
          git clone --depth 1 \
            --branch "${GO_BRANCH}" \
            https://github.com/BieHDC/go-backports.git \
            go-backports

      - name: Build Go XP cross compiler
        shell: bash
        run: |
          set -eux

          cd go-backports/src

          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export CGO_ENABLED=0

          ./make.bash

          cd ../..

          echo "GOROOT=$GITHUB_WORKSPACE/go-backports" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"

      - name: Verify XP Go toolchain
        run: |
          go version
          go env GOOS GOARCH GOROOT

      - name: Checkout v2rayA
        run: |
          git clone --depth 1 \
            --branch "${V2RAYA_TAG}" \
            https://github.com/v2rayA/v2rayA.git \
            v2rayA

      - name: Download and prepare Web frontend
        shell: bash
        run: |
          set -eux

          cd v2rayA

          # 下载 v2.2.7.5 官方 Web 前端
          curl -fL \
            https://github.com/v2rayA/v2rayA/releases/download/v2.2.7.5/web.tar.gz \
            -o web.tar.gz

          # 校验文件完整性
          echo "89bff9248a9cba8b7bda6e1202ac565dbca377319423868835235deddbfb182a  web.tar.gz" \
            | sha256sum -c -

          # 创建 Go embed 所需目录
          mkdir -p service/server/router/web

          # 解压前端文件
          tar -xzf web.tar.gz \
            -C service/server/router/web \
            --strip-components=1

          # 确认静态文件存在
          test -n "$(find service/server/router/web -type f -print -quit)"

          echo "Web frontend prepared successfully"
          find service/server/router/web -maxdepth 2 -type f | head -20

      - name: Fix and verify XP dependencies
        working-directory: v2rayA/service
        shell: bash
        run: |
          set -eux

          # 将 xdg 降级到 XP 兼容版本
          go mod edit \
            -replace=github.com/adrg/xdg=github.com/adrg/xdg@v0.3.4

          # 重新整理依赖关系，生成完整 go.sum
          go mod tidy

          # 下载依赖
          go mod download

          # 验证依赖完整性
          go mod verify

          # 确认实际使用的版本
          go list -m -json github.com/adrg/xdg
      - name: Build v2rayA
        working-directory: v2rayA/service
        shell: bash
        run: |
          set -eux

          mkdir -p ../dist

          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=0

          go build \
            -mod=mod \
            -trimpath \
            -tags "netgo osusergo" \
            -ldflags "-s -w" \
            -o ../dist/v2raya.exe \
            .
      - name: Verify executable
        run: |
          file v2rayA/dist/v2raya.exe
          ls -lh v2rayA/dist/v2raya.exe

      - name: Package release
        run: |
          cd v2rayA/dist

          cat > README.txt <<'EOF'
          v2rayA Windows XP x86 build

          Version: v2.2.7.5
          Architecture: Windows 32-bit x86
          Go: BieHDC/go-backports Go 1.21 NT5.1
          CGO: disabled

          Run:
          v2raya.exe --lite --v2ray-bin v2ray.exe

          Open:
          http://127.0.0.1:2017

          The V2Ray core is not included.
          EOF


      - name: Prepare release files
        run: |
          mkdir -p release
          cp v2rayA/dist/v2raya.exe release/
          cp v2rayA/dist/README.txt release/

      - name: Upload XP build
        uses: actions/upload-artifact@v4
        with:
          name: v2raya-xp-x86
          path: release/*
          if-no-files-found: error


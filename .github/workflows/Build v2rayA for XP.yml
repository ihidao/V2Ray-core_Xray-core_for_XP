
name: Build v2rayA for Windows XP x86

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v2raya-xp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. 检出当前仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. 安装 Bootstrap Go 1.21.13
      # ==========================================
      - name: Setup Bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"
          cache: false

      # ==========================================
      # 3. 下载 XP 兼容版 Go 工具链
      # ==========================================
      - name: Clone Go XP toolchain
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch release-branch.go1.21-nt51 \
            https://github.com/BieHDC/go-backports.git \
            go-backports

      # ==========================================
      # 4. 编译 XP 兼容版 Go
      # ==========================================
      - name: Build Go XP toolchain
        shell: bash
        run: |
          set -eux

          export GOROOT_BOOTSTRAP="$(go env GOROOT)"

          cd go-backports/src

          ./make.bash

          cd "$GITHUB_WORKSPACE"

          test -x go-backports/bin/go

          echo "GOROOT=$GITHUB_WORKSPACE/go-backports" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 5. 验证 XP Go 工具链
      # ==========================================
      - name: Verify Go XP toolchain
        shell: bash
        run: |
          set -eux

          go version
          go env GOROOT
          go env GOOS
          go env GOARCH

      # ==========================================
      # 6. 下载 v2rayA v2.2.7.5 源码
      # ==========================================
      - name: Clone v2rayA
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch v2.2.7.5 \
            https://github.com/v2rayA/v2rayA.git \
            v2rayA

      # ==========================================
      # 7. 下载官方 Web 前端资源
      # ==========================================
      - name: Download v2rayA web resources
        shell: bash
        run: |
          set -eux

          WEB_DIR="$GITHUB_WORKSPACE/v2rayA/service/server/router/web"

          mkdir -p "$WEB_DIR"

          curl -fL --retry 3 \
            https://github.com/v2rayA/v2rayA/releases/download/v2.2.7.5/web.tar.gz \
            -o "$GITHUB_WORKSPACE/web.tar.gz"

          test -s "$GITHUB_WORKSPACE/web.tar.gz"

          tar -tzf "$GITHUB_WORKSPACE/web.tar.gz" \
            > "$GITHUB_WORKSPACE/web-files.txt"

          echo "===== Web archive contents ====="
          sed -n '1,30p' "$GITHUB_WORKSPACE/web-files.txt"

          tar -xzf "$GITHUB_WORKSPACE/web.tar.gz" \
            --strip-components=1 \
            -C "$WEB_DIR"

          test -n "$(find "$WEB_DIR" -type f -print -quit)"

          echo "===== Web resources installed ====="
          find "$WEB_DIR" -maxdepth 2 -type f | head -30
      # ==========================================
      # 8. 修复 Windows XP xdg 兼容性
      # ==========================================
      - name: Apply xdg XP compatibility fix
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/v2rayA/service"

          # 将 xdg v0.4.0 替换为 XP 兼容的 v0.3.4
          go mod edit \
            -replace=github.com/adrg/xdg=github.com/adrg/xdg@v0.3.4

          # 显式下载替换后的模块，补齐 go.sum
          go mod download github.com/adrg/xdg

          # 检查模块替换信息
          echo "===== xdg module information ====="

          go list -m -json github.com/adrg/xdg

          # 使用 -mod=mod 确保必要的 go.sum 自动补齐
          XDG_DIR="$(go list -mod=mod -f '{{.Dir}}' github.com/adrg/xdg)"

          echo "===== Actual xdg source directory ====="
          echo "$XDG_DIR"

          test -d "$XDG_DIR"

          # 确认实际源码中没有 XP 不支持的 API
          if grep -R -n "SHGetKnownFolderPath" "$XDG_DIR"; then
            echo "ERROR: Incompatible SHGetKnownFolderPath API found!"
            exit 1
          fi

          echo "xdg XP compatibility check passed."

          # 显示最终依赖替换信息
          go list -m all | grep 'github.com/adrg/xdg'
      # ==========================================
      # 9. 创建编译输出目录
      # ==========================================
      - name: Prepare build directory
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/release"

      # ==========================================
      # 10. 编译 v2rayA Windows XP 32 位
      # ==========================================
      - name: Build v2rayA Windows XP x86
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/v2rayA/service"

          export GOOS=windows
          export GOARCH=386
          export CGO_ENABLED=0
          export GOTOOLCHAIN=local

          echo "===== Build environment ====="

          go version
          go env GOROOT
          go env GOOS
          go env GOARCH
          go env CGO_ENABLED

          # 编译 v2rayA 服务端
          go build \
            -trimpath \
            -ldflags="-X github.com/v2rayA/v2rayA/conf.Version=2.2.7.5 -s -w" \
            -o "$GITHUB_WORKSPACE/release/v2raya.exe" \
            .

          test -s "$GITHUB_WORKSPACE/release/v2raya.exe"

          echo "===== Build completed ====="

      # ==========================================
      # 11. 生成 XP 启动批处理
      # ==========================================
      - name: Create startup batch
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/release/start-v2raya.bat" <<'EOF'
          @echo off
          setlocal

          cd /d "%~dp0"

          title v2rayA Windows XP

          echo ========================================
          echo          v2rayA Windows XP
          echo ========================================
          echo.

          rem 使用当前程序目录存放 Geo 数据
          set "V2RAY_LOCATION_ASSET=%~dp0"

          rem 同时设置 Xray 变量，便于更换内核
          set "XRAY_LOCATION_ASSET=%~dp0"

          rem 检查 v2ray.exe
          if not exist "%~dp0v2ray.exe" (
              echo [ERROR] v2ray.exe not found!
              echo Please put v2ray.exe beside v2raya.exe.
              pause
              exit /b 1
          )

          rem 检查 geoip.dat
          if not exist "%~dp0geoip.dat" (
              echo [ERROR] geoip.dat not found!
              echo Please put geoip.dat beside v2raya.exe.
              pause
              exit /b 1
          )

          rem 检查 geosite.dat
          if not exist "%~dp0geosite.dat" (
              echo [ERROR] geosite.dat not found!
              echo Please put geosite.dat beside v2raya.exe.
              pause
              exit /b 1
          )

          echo Starting v2rayA...
          echo.

          "%~dp0v2raya.exe" --lite --v2ray-bin "%~dp0v2ray.exe"

          echo.
          echo v2rayA has exited.
          pause

          endlocal
          EOF

          test -s "$GITHUB_WORKSPACE/release/start-v2raya.bat"

          # ==========================================
      # 12. 检查编译产物
      # ==========================================
      - name: Verify release files
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          test -s release/v2raya.exe
          test -s release/start-v2raya.bat

          echo "===== File sizes ====="
          ls -lh release/

          echo "===== SHA256 ====="
          sha256sum release/*

          echo "===== PE architecture ====="

          PE_INFO="$(file release/v2raya.exe)"

          echo "$PE_INFO"

          # 检查 32 位 PE 文件
          echo "$PE_INFO" | grep -q "PE32 executable"

          # 检查 Intel 386 架构
          echo "$PE_INFO" | grep -Eq "Intel (i386|80386)"

          # 检查 Windows XP 版本标识
          echo "$PE_INFO" | grep -q "MS Windows 5.01"

          echo "========================================"
          echo "SUCCESS: Windows XP x86 executable verified"
          echo "========================================"

      # ==========================================
      # 13. 上传编译结果
      # ==========================================
      - name: Upload XP x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2raya-xp-x86-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          compression-level: 6

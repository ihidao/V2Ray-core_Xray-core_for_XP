
name: Build v2ray-core_5.18.0 for XP

on:
  workflow_dispatch:
    inputs:
      v2ray_version:
        description: 'V2Ray version (e.g. 5.16.0)'
        required: false
        default: '5.16.0'
        type: string

  push:
    tags:
      - 'v*'

# ==========================================================
# 全局版本变量：通常只需要修改这里
# ==========================================================
env:
  V2RAY_VERSION: '5.16.0'
  GO_VERSION: '1.21.13'
  SOURCE_PREFIX: 'v2ray-core_'
  GO_BACKPORTS_REPO: 'BieHDC/go-backports'
  GO_BACKPORTS_REF: 'release-branch.go1.21-nt51'

permissions:
  contents: write

jobs:
  build_v2ray-core_for_xp:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 1. Checkout 主仓库
      # ------------------------------------------------------
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. 确定实际编译版本
      # ------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.v2ray_version }}"

          # Tag 触发时，优先使用 Tag 中的版本号
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          # 手动触发未填写时使用默认版本
          if [[ -z "$VERSION" ]]; then
            VERSION="${V2RAY_VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "V2Ray version: $VERSION"

      # ------------------------------------------------------
      # 3. Checkout XP Go 源码
      # ------------------------------------------------------
      - name: Checkout go-backports
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GO_BACKPORTS_REPO }}
          ref: ${{ env.GO_BACKPORTS_REF }}
          path: go-backports

      # ------------------------------------------------------
      # 4. 安装 Bootstrap Go
      # ------------------------------------------------------
      - name: Setup bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # ------------------------------------------------------
      # 5. 编译 XP 兼容 Go 工具链
      # ------------------------------------------------------
      - name: Build XP-compatible Go toolchain
        working-directory: go-backports/src
        shell: bash
        run: |
          export CGO_ENABLED=0
          ./make.bash

      # ------------------------------------------------------
      # 6. 切换到 XP Go
      # ------------------------------------------------------
      - name: Add XP Go to PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/go-backports/bin/go" version

      # ------------------------------------------------------
      # 7. 确定 V2Ray 源码目录
      # ------------------------------------------------------
      - name: Determine v2ray source path
        id: src
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SRC="${SOURCE_PREFIX}${VERSION}"

          if [ -d "$SRC" ]; then
            echo "path=$SRC" >> "$GITHUB_OUTPUT"
          elif [ -d "v2ray" ]; then
            echo "path=v2ray" >> "$GITHUB_OUTPUT"
          else
            echo "找不到 V2Ray 源码目录：$SRC"
            echo "当前仓库目录："
            ls -la
            exit 1
          fi

      # ------------------------------------------------------
      # 8. 下载 Go 模块
      # ------------------------------------------------------
      - name: Download modules
        working-directory: ${{ steps.src.outputs.path }}
        run: |
          go mod download

      # ------------------------------------------------------
      # 9. 编译 Windows XP 32 位版本
      # ------------------------------------------------------
      - name: Build for Windows XP (386)
        working-directory: ${{ steps.src.outputs.path }}
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: 386
        shell: bash
        run: |
          echo "Building V2Ray ${{ steps.version.outputs.version }}"

          go build \
            -o v2ray.exe \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            ./main

          go build \
            -o v2ctl.exe \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -tags confonly \
            ./infra/control/main || true

      # ------------------------------------------------------
      # 10. 整理编译结果
      # ------------------------------------------------------
      - name: Prepare output
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SRC: ${{ steps.src.outputs.path }}
        run: |
          mkdir -p dist

          cp "$SRC/v2ray.exe" dist/

          if [ -f "$SRC/v2ctl.exe" ]; then
            cp "$SRC/v2ctl.exe" dist/
          fi

          cd dist

          zip -r "../v2ray-${VERSION}-xp-386.zip" .

      # ------------------------------------------------------
      # 11. 上传 Actions Artifact
      # ------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-${{ steps.version.outputs.version }}-xp-386
          path: |
            dist/v2ray.exe
            dist/v2ctl.exe
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------
      # 12. 创建 GitHub Release
      # ------------------------------------------------------
      - name: Create Release (when tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: v2ray-${{ steps.version.outputs.version }}-xp-386.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
